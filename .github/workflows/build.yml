name: Build Mesa Fork

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v3

    - name: Instalar dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build python3-mako python3-pip \
          libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
          libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
          libxcb-present-dev libxcb-sync-dev libxshmfence-dev \
          libxxf86vm-dev libxrandr-dev libwayland-dev wayland-protocols \
          libzstd-dev libexpat1-dev libvulkan-dev

    - name: Configurar build
      run: |
        mkdir build
        cd build
        meson ..

    - name: Compilar
      run: |
        cd build
        ninja

    - name: Upload artefato compilado
      uses: actions/upload-artifact@v3
      with:
        name: mesa-build
        path: build/
