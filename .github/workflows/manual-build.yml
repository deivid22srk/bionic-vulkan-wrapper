name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'android-arm64'
        type: choice
        options:
          - android-arm64
          - android-arm32
          - both
      optimization_level:
        description: 'Optimization Level'
        required: true
        default: 'mobile'
        type: choice
        options:
          - mobile      # Mobile optimizations + power efficiency
          - performance # Maximum performance + LTO
          - debug       # Debug symbols + sanitizers
          - minimal     # Minimal size build
      drivers:
        description: 'Drivers to build'
        required: false
        default: 'freedreno,panfrost'
        type: choice
        options:
          - freedreno,panfrost
          - freedreno
          - panfrost
      android_api:
        description: 'Android API level'
        required: false
        default: '28'
        type: string
      enable_tools:
        description: 'Build debugging tools'
        required: false
        default: true
        type: boolean

jobs:
  dispatch-build:
    name: Setup Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      config-matrix: ${{ steps.setup.outputs.matrix }}
    
    steps:
    - name: Generate Build Matrix
      id: setup
      run: |
        PLATFORM="${{ github.event.inputs.platform }}"
        OPTIMIZATION="${{ github.event.inputs.optimization_level }}"
        
        case "$PLATFORM" in
          "android-arm64")
            MATRIX='{"include":[{"platform":"android","target":"aarch64-linux-android","abi":"arm64-v8a","config":"'"$OPTIMIZATION"'"}]}'
            ;;
          "android-arm32")
            MATRIX='{"include":[{"platform":"android","target":"arm-linux-androideabi","abi":"armeabi-v7a","config":"'"$OPTIMIZATION"'"}]}'
            ;;
          "both")
            MATRIX='{"include":[
              {"platform":"android","target":"aarch64-linux-android","abi":"arm64-v8a","config":"'"$OPTIMIZATION"'"},
              {"platform":"android","target":"arm-linux-androideabi","abi":"armeabi-v7a","config":"'"$OPTIMIZATION"'"}
            ]}'
            ;;
        esac
        
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        echo "Generated build matrix for $PLATFORM with $OPTIMIZATION optimization"

  build-android:
    name: Android ${{ matrix.abi }} (${{ matrix.config }})
    runs-on: ubuntu-22.04
    needs: dispatch-build
    timeout-minutes: 120
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dispatch-build.outputs.config-matrix) }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: false
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: manual-android-${{ matrix.abi }}-${{ matrix.config }}-${{ github.ref_name }}
        max-size: 3G
    
    - name: Install Base Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          bison \
          flex \
          gettext \
          libedit-dev \
          libelf-dev \
          libexpat1-dev \
          libffi-dev \
          libudev-dev \
          libxml2-utils \
          ninja-build \
          pkg-config \
          python3-mako \
          python3-packaging \
          python3-ply \
          python3-yaml \
          zlib1g-dev \
          ccache \
          curl \
          python3-pip
    
    - name: Install Latest Meson
      run: |
        # Remove system meson if installed
        sudo apt-get remove -y meson || true
        
        # Install latest meson from pip
        pip3 install --user --upgrade meson>=1.1.0
        
        # Add to PATH  
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        
        # Verify installation
        ~/.local/bin/meson --version
        python3 -c "import mesonbuild; print(f'Meson version: {mesonbuild.coredata.version}')"
    
    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true
        link-to-sdk: true
    
    - name: Verify NDK Installation
      run: |
        echo "NDK Root: $ANDROID_NDK_ROOT"
        echo "NDK Latest: $ANDROID_NDK_LATEST_HOME"
        ls -la "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -10
        
        # Test compiler
        "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${{ github.event.inputs.android_api || '28' }}-clang" --version
    
    - name: Create Android Cross File
      run: |
        API_LEVEL="${{ github.event.inputs.android_api || '28' }}"
        NDK_ROOT="${ANDROID_NDK_ROOT:-${ANDROID_NDK_LATEST_HOME}}"
        
        # Verify compiler exists
        COMPILER="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${API_LEVEL}-clang"
        if [ ! -f "$COMPILER" ]; then
          echo "Error: Compiler not found: $COMPILER"
          echo "Available compilers:"
          ls -la "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}"*-clang* || true
          exit 1
        fi
        
        cat > android-cross-${{ matrix.abi }}.txt << EOF
        [binaries]
        c = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${API_LEVEL}-clang'
        cpp = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${API_LEVEL}-clang++'
        ar = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        pkgconfig = 'pkg-config'
        
        [host_machine]
        system = 'android'
        cpu_family = '${{ matrix.abi == 'arm64-v8a' && 'aarch64' || 'arm' }}'
        cpu = '${{ matrix.abi == 'arm64-v8a' && 'armv8' || 'armv7' }}'
        endian = 'little'
        
        [built-in options]
        c_args = ['-fPIC', '-fstack-protector-strong', '-ffunction-sections', '-fdata-sections', '-Os']
        cpp_args = ['-fPIC', '-fstack-protector-strong', '-ffunction-sections', '-fdata-sections', '-Os']
        c_link_args = ['-Wl,--gc-sections', '-Wl,--as-needed', '-Wl,--strip-all']
        cpp_link_args = ['-Wl,--gc-sections', '-Wl,--as-needed', '-Wl,--strip-all']
        EOF
        
        echo "=== Cross-compilation file ==="
        cat android-cross-${{ matrix.abi }}.txt
    
    - name: Configure Build Options
      id: build-config
      run: |
        DRIVERS="${{ github.event.inputs.drivers || 'freedreno,panfrost' }}"
        TOOLS_ENABLED="${{ github.event.inputs.enable_tools || 'true' }}"
        CONFIG="${{ matrix.config }}"
        
        # Base configuration
        BUILD_ARGS=("--cross-file" "android-cross-${{ matrix.abi }}.txt")
        
        # Platform settings
        BUILD_ARGS+=("-Dplatforms=android")
        BUILD_ARGS+=("-Dandroid-stub=true")
        BUILD_ARGS+=("-Dgbm=disabled")
        BUILD_ARGS+=("-Dglx=disabled")
        BUILD_ARGS+=("-Ddri3=disabled")
        BUILD_ARGS+=("-Dxmlconfig=disabled")
        BUILD_ARGS+=("-Dosmesa=false")
        BUILD_ARGS+=("-Dlibunwind=disabled")
        BUILD_ARGS+=("-Dllvm=disabled")
        
        # Optimization settings
        case "$CONFIG" in
          "mobile")
            BUILD_ARGS+=("--buildtype=debugoptimized")
            BUILD_ARGS+=("-Db_lto=true")
            BUILD_ARGS+=("-Db_ndebug=if-release")
            BUILD_ARGS+=("-Doptimization=2")
            ;;
          "performance")
            BUILD_ARGS+=("--buildtype=release")
            BUILD_ARGS+=("-Db_lto=true")
            BUILD_ARGS+=("-Db_ndebug=true")
            BUILD_ARGS+=("-Doptimization=3")
            ;;
          "debug")
            BUILD_ARGS+=("--buildtype=debug")
            BUILD_ARGS+=("-Doptimization=g")
            BUILD_ARGS+=("-Db_sanitize=address,undefined")
            ;;
          "minimal")
            BUILD_ARGS+=("--buildtype=release")
            BUILD_ARGS+=("-Doptimization=s")
            BUILD_ARGS+=("-Db_lto=false")
            DRIVERS="freedreno"  # Only Freedreno for minimal
            ;;
        esac
        
        # Driver settings
        BUILD_ARGS+=("-Dgallium-drivers=$DRIVERS")
        BUILD_ARGS+=("-Dvulkan-drivers=$DRIVERS")
        
        # Common settings
        BUILD_ARGS+=("-Degl=enabled")
        BUILD_ARGS+=("-Dgles1=enabled")
        BUILD_ARGS+=("-Dgles2=enabled")
        BUILD_ARGS+=("-Dshared-glapi=enabled")
        BUILD_ARGS+=("-Dshader-cache=enabled")
        BUILD_ARGS+=("-Dvulkan-layers=device-select,overlay")
        
        # Tools (conditional)
        if [[ "$TOOLS_ENABLED" == "true" && "$CONFIG" != "minimal" ]]; then
          BUILD_ARGS+=("-Dtools=freedreno,panfrost")
        fi
        
        # Save configuration
        printf '%s\n' "${BUILD_ARGS[@]}" > build_args.txt
        echo "drivers=$DRIVERS" >> $GITHUB_OUTPUT
        
        echo "=== Build Configuration ==="
        echo "Config: $CONFIG"
        echo "Drivers: $DRIVERS"  
        echo "Tools: $TOOLS_ENABLED"
        echo ""
        echo "Meson arguments:"
        cat build_args.txt
    
    - name: Configure Mesa Build
      run: |
        BUILD_ARGS=($(cat build_args.txt))
        
        echo "Configuring Mesa with meson..."
        ~/.local/bin/meson setup build "${BUILD_ARGS[@]}"
        
        echo ""
        echo "=== Build Configuration Summary ==="
        ~/.local/bin/meson introspect build --buildoptions | jq -r '.[] | select(.name == "buildtype" or .name == "optimization" or .name == "b_lto") | "\(.name): \(.value)"' || true
    
    - name: Set Mobile Optimization Environment
      if: matrix.config == 'mobile'
      run: |
        echo "Setting mobile optimization environment variables..."
        echo "TU_ENABLE_MOBILE_OPTIMIZATIONS=1" >> $GITHUB_ENV
        echo "TU_PREFER_GMEM_RENDERING=1" >> $GITHUB_ENV
        echo "TU_ENABLE_LRZ_OPTIMIZATION=1" >> $GITHUB_ENV
        echo "PANFROST_FORCE_AFBC=1" >> $GITHUB_ENV
        echo "PANFROST_ENABLE_TILE_OPTIMIZATION=1" >> $GITHUB_ENV
    
    - name: Build Mesa
      run: |
        echo "Building Mesa with $(nproc) parallel jobs..."
        
        # Build with timing
        time ninja -C build -j$(nproc)
        
        echo "Build completed successfully!"
    
    - name: Validate Build Results
      run: |
        echo "=== Build Validation ==="
        
        # Basic statistics  
        SO_COUNT=$(find build -name "*.so" -type f | wc -l)
        BUILD_SIZE=$(du -sh build | cut -f1)
        
        echo "Built $SO_COUNT shared libraries"
        echo "Total build size: $BUILD_SIZE"
        
        echo ""
        echo "=== Shared Libraries ==="
        find build -name "*.so" -type f | head -20
        
        echo ""
        echo "=== Driver-Specific Files ==="
        DRIVERS="${{ steps.build-config.outputs.drivers }}"
        
        if [[ "$DRIVERS" == *"freedreno"* ]]; then
          echo "Freedreno/Turnip files:"
          find build -name "*freedreno*" -o -name "*turnip*" | head -5
        fi
        
        if [[ "$DRIVERS" == *"panfrost"* ]]; then
          echo "Panfrost files:"
          find build -name "*panfrost*" -o -name "*panvk*" | head -5
        fi
        
        echo ""
        echo "=== Key Android Libraries ==="
        find build -name "*vulkan_android*" -o -name "*EGL*" -o -name "*GLES*" | head -10
    
    - name: Package Android Drivers
      run: |
        PACKAGE_DIR="mesa-android-${{ matrix.abi }}"
        mkdir -p "$PACKAGE_DIR"/{drivers,tools,docs}
        
        # Copy all shared libraries
        echo "Packaging shared libraries..."
        find build -name "*.so" -type f -exec cp {} "$PACKAGE_DIR/drivers/" \; 2>/dev/null || true
        
        # Copy tools if built
        if [[ "${{ github.event.inputs.enable_tools }}" == "true" ]]; then
          echo "Packaging tools..."
          find build -type f -executable -path "*/bin/*" -exec cp {} "$PACKAGE_DIR/tools/" \; 2>/dev/null || true
        fi
        
        # Create comprehensive build information
        cat > "$PACKAGE_DIR/BUILD_INFO.txt" << EOF
        Mesa Mobile GPU Drivers - Android Build
        ======================================
        
        Build Configuration:
        - Architecture: ${{ matrix.abi }}
        - Target: ${{ matrix.target }}
        - Optimization: ${{ matrix.config }}
        - Android API: ${{ github.event.inputs.android_api || '28' }}
        - Drivers: ${{ steps.build-config.outputs.drivers }}
        - Tools: ${{ github.event.inputs.enable_tools }}
        
        Source Information:
        - Branch: ${{ github.ref_name }}
        - Commit: ${{ github.sha }}
        - Build Date: $(date -u)
        - Build Number: ${{ github.run_number }}
        
        Package Statistics:
        - Shared Libraries: $(find "$PACKAGE_DIR/drivers" -name "*.so" 2>/dev/null | wc -l)
        - Tools: $(find "$PACKAGE_DIR/tools" -type f 2>/dev/null | wc -l)
        - Package Size: $(du -sh "$PACKAGE_DIR" | cut -f1)
        
        Mobile Optimizations:
        ${{ matrix.config == 'mobile' && 'ENABLED - Power efficiency and tile-based rendering optimizations active' || 'DISABLED - Standard build without mobile-specific optimizations' }}
        
        Hardware Support:
        - Qualcomm Adreno: 4xx, 5xx, 6xx, 7xx series
        - ARM Mali: Midgard, Bifrost, Valhall, Immortalis
        
        Installation:
        1. Push drivers: adb push drivers/*.so /data/local/tmp/
        2. Install (root): adb shell "su -c 'cp /data/local/tmp/*.so /vendor/lib${{ matrix.abi == 'arm64-v8a' && '64' || '' }}/hw/'"
        3. Set permissions: adb shell "su -c 'chmod 644 /vendor/lib${{ matrix.abi == 'arm64-v8a' && '64' || '' }}/hw/*.so'"
        4. Reboot device: adb reboot
        
        Environment Variables (for mobile optimization):
        export TU_ENABLE_MOBILE_OPTIMIZATIONS=1
        export TU_PREFER_GMEM_RENDERING=1
        export TU_ENABLE_LRZ_OPTIMIZATION=1
        export PANFROST_FORCE_AFBC=1
        export PANFROST_ENABLE_TILE_OPTIMIZATION=1
        EOF
        
        # Create installation script
        cat > "$PACKAGE_DIR/install.sh" << 'INSTALL_SCRIPT'
        #!/bin/bash
        # Mesa Android Mobile Drivers - Installation Script
        
        set -e
        
        ABI="${{ matrix.abi }}"
        LIB_DIR="/vendor/lib${{ matrix.abi == 'arm64-v8a' && '64' || '' }}/hw"
        
        echo "Mesa Mobile GPU Drivers Installer"
        echo "Architecture: $ABI"
        echo "=================================="
        
        # Check device connection
        if ! adb devices | grep -q "device$"; then
          echo "❌ No Android device connected via ADB"
          exit 1
        fi
        
        # Check root access
        if ! adb shell "su -c 'echo OK'" 2>/dev/null | grep -q "OK"; then
          echo "❌ Root access required on Android device"
          exit 1
        fi
        
        echo "✅ Device connected and rooted"
        
        # Backup existing drivers
        echo "📦 Creating backup of existing drivers..."
        adb shell "su -c 'mkdir -p /data/backup/mesa-original/'"
        adb shell "su -c 'cp $LIB_DIR/*.so /data/backup/mesa-original/ 2>/dev/null || echo No existing drivers to backup'"
        
        # Push new drivers
        echo "📤 Pushing Mesa drivers to device..."
        adb push drivers/*.so /data/local/tmp/
        
        # Install drivers
        echo "🔧 Installing drivers..."
        adb shell "su -c 'mount -o rw,remount /vendor || mount -o rw,remount /system'"
        adb shell "su -c 'cp /data/local/tmp/*.so $LIB_DIR/'"
        adb shell "su -c 'chmod 644 $LIB_DIR/*.so'"
        adb shell "su -c 'chown root:root $LIB_DIR/*.so'"
        
        # Set optimization properties
        if [[ "${{ matrix.config }}" == "mobile" ]]; then
          echo "📱 Enabling mobile optimizations..."
          adb shell "su -c 'setprop debug.egl.hw 1'"
          adb shell "su -c 'setprop ro.hardware.egl mesa'"
          adb shell "su -c 'setprop debug.mesa.mobile_opt 1'"
        fi
        
        # Cleanup
        adb shell "rm -f /data/local/tmp/*.so"
        
        echo ""
        echo "🎉 Installation completed successfully!"
        echo ""
        echo "Next steps:"
        echo "1. Reboot device: adb reboot"
        echo "2. Verify installation: adb shell getprop | grep egl"
        echo ""
        echo "To restore original drivers if needed:"
        echo "adb shell \"su -c 'cp /data/backup/mesa-original/*.so $LIB_DIR/'\""
        INSTALL_SCRIPT
        
        chmod +x "$PACKAGE_DIR/install.sh"
        
        # List package contents
        echo ""
        echo "=== Package Contents ==="
        find "$PACKAGE_DIR" -type f | sort
        echo ""
        echo "Package ready: $PACKAGE_DIR"
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mesa-android-manual-${{ matrix.abi }}-${{ matrix.config }}-${{ github.run_number }}
        path: mesa-android-${{ matrix.abi }}/
        retention-days: 21
        compression-level: 6

  create-installation-guide:
    name: Generate Installation Guide
    runs-on: ubuntu-22.04
    needs: build-android
    if: always()
    
    steps:
    - name: Create Complete Installation Guide
      run: |
        cat > ANDROID_INSTALLATION_GUIDE.md << 'EOF'
        # Mesa Mobile GPU Drivers - Android Installation Guide
        
        Complete guide for installing Mesa mobile GPU drivers with Adreno/Mali optimizations on Android devices.
        
        ## 🔧 Prerequisites
        
        ### Device Requirements:
        - **Rooted Android device** (Magisk, SuperSU, or custom ROM)
        - **ADB debugging enabled** in Developer Options
        - **Qualcomm Adreno** or **ARM Mali** GPU
        - **Android 7.0+** (API level 24+) recommended
        
        ### Computer Requirements:
        - **ADB tools** installed and in PATH
        - **USB cable** for device connection
        - **Windows/Linux/macOS** computer
        
        ## 📱 Supported Hardware
        
        ### Qualcomm Adreno GPUs:
        - **Adreno 7xx**: Latest flagship smartphones (Snapdragon 8 Gen 3/4)
        - **Adreno 6xx**: High-end devices (Snapdragon 8xx series)
        - **Adreno 5xx**: Mid-range devices (Snapdragon 6xx/7xx series)  
        - **Adreno 4xx**: Older devices (Snapdragon 4xx/6xx series)
        
        ### ARM Mali GPUs:
        - **Immortalis**: Latest premium devices (G715, G720)
        - **Valhall**: Modern devices (G57, G68, G76, G78, G310, G610)
        - **Bifrost**: Recent devices (G31, G52, G72, G76)
        - **Midgard**: Older devices (T600-T880 series)
        
        ## 🏗️ Build Selection Guide
        
        ### Choose Your Architecture:
        ```bash
        # Check device architecture
        adb shell getprop ro.product.cpu.abi
        ```
        
        - **arm64-v8a**: Modern 64-bit devices (most current phones)
        - **armeabi-v7a**: Older 32-bit devices
        
        ### Choose Your Build Type:
        - **mobile**: 🔋 Best for daily use (power efficient + performance)
        - **performance**: ⚡ Maximum speed (high-end gaming)
        - **debug**: 🐛 Development/testing (with debug info)
        - **minimal**: 📦 Smallest size (basic functionality only)
        
        ## 📥 Download & Installation
        
        ### Method 1: Automatic Installation (Recommended)
        
        1. **Download** the appropriate build from GitHub Actions
        2. **Extract** the archive
        3. **Connect** your device via ADB
        4. **Run** the installation script:
        
        ```bash
        # Navigate to extracted folder
        cd mesa-android-[your-architecture]/
        
        # Make script executable (Linux/macOS)
        chmod +x install.sh
        
        # Run installation
        ./install.sh
        
        # Reboot device
        adb reboot
        ```
        
        ### Method 2: Manual Installation
        
        #### Step 1: Prepare Device
        ```bash
        # Enable ADB debugging and connect device
        adb devices
        
        # Verify root access
        adb shell "su -c 'echo Root access confirmed'"
        
        # Check current GPU info
        adb shell getprop ro.hardware.egl
        adb shell getprop ro.hardware.vulkan
        ```
        
        #### Step 2: Backup Original Drivers
        ```bash
        # Create backup directory
        adb shell "su -c 'mkdir -p /data/backup/original-drivers/'"
        
        # Backup existing drivers
        adb shell "su -c 'cp /vendor/lib*/hw/*.so /data/backup/original-drivers/ 2>/dev/null || true'"
        adb shell "su -c 'cp /system/lib*/hw/*.so /data/backup/original-drivers/ 2>/dev/null || true'"
        
        echo "Drivers backed up to /data/backup/original-drivers/"
        ```
        
        #### Step 3: Install Mesa Drivers
        ```bash
        # Push drivers to device
        adb push drivers/*.so /data/local/tmp/
        
        # Make vendor partition writable
        adb shell "su -c 'mount -o rw,remount /vendor'"
        
        # Install drivers (choose correct lib path for your architecture)
        # For arm64-v8a (64-bit):
        adb shell "su -c 'cp /data/local/tmp/*.so /vendor/lib64/hw/'"
        
        # For armeabi-v7a (32-bit):
        adb shell "su -c 'cp /data/local/tmp/*.so /vendor/lib/hw/'"
        
        # Set correct permissions
        adb shell "su -c 'chmod 644 /vendor/lib*/hw/*.so'"
        adb shell "su -c 'chown root:root /vendor/lib*/hw/*.so'"
        
        # Clean temporary files
        adb shell "rm -f /data/local/tmp/*.so"
        ```
        
        #### Step 4: Configure System Properties
        ```bash
        # Enable hardware acceleration
        adb shell "su -c 'setprop debug.egl.hw 1'"
        adb shell "su -c 'setprop ro.hardware.egl mesa'"
        adb shell "su -c 'setprop ro.hardware.vulkan mesa'"
        
        # Enable mobile optimizations (for mobile builds)
        adb shell "su -c 'setprop debug.mesa.mobile_opt 1'"
        adb shell "su -c 'setprop debug.mesa.gmem_prefer 1'"
        ```
        
        #### Step 5: Reboot and Verify
        ```bash
        # Reboot device
        adb reboot
        
        # Wait for boot, then verify installation
        adb shell getprop | grep egl
        adb shell dumpsys SurfaceFlinger | grep -i mesa
        ```
        
        ## 🔍 Verification & Testing
        
        ### Check Installation Status:
        ```bash
        # Verify Mesa drivers are loaded
        adb shell getprop ro.hardware.egl
        adb shell getprop ro.hardware.vulkan
        
        # Check OpenGL ES version
        adb shell dumpsys SurfaceFlinger | grep "GLES"
        
        # List loaded graphics libraries
        adb shell "su -c 'lsof | grep -E \"(EGL|GLES|vulkan)\" | head -10'"
        ```
        
        ### Test Applications:
        - **Antutu 3D Benchmark**: OpenGL ES performance
        - **GFXBench**: Mobile GPU benchmarking  
        - **3DMark**: Cross-platform graphics test
        - **Vulkan Capabilities Viewer**: Vulkan API testing
        
        ### Performance Monitoring:
        ```bash
        # Monitor GPU utilization (if supported)
        adb shell "cat /sys/class/kgsl/kgsl-3d0/gpuload"
        
        # Check thermal status
        adb shell "cat /sys/class/thermal/thermal_zone*/temp"
        
        # Monitor frame rates in games
        adb shell "dumpsys gfxinfo [package.name] framestats"
        ```
        
        ## ⚙️ Mobile Optimization Settings
        
        ### Environment Variables (Advanced):
        Create `/system/etc/init/mesa_mobile.rc` (requires system partition modification):
        
        ```bash
        # Adreno Optimizations
        setenv TU_ENABLE_MOBILE_OPTIMIZATIONS 1
        setenv TU_PREFER_GMEM_RENDERING 1
        setenv TU_ENABLE_LRZ_OPTIMIZATION 1
        setenv TU_DEBUG nobypass
        
        # Mali Optimizations  
        setenv PANFROST_FORCE_AFBC 1
        setenv PANFROST_ENABLE_TILE_OPTIMIZATION 1
        setenv PAN_MESA_DEBUG afbc,tiling
        
        # General Mesa Settings
        setenv MESA_GLSL_CACHE_DISABLE 0
        setenv MESA_SHADER_CACHE_DIR /data/local/tmp/mesa_cache
        ```
        
        ### Performance Tuning:
        ```bash
        # Create shader cache directory
        adb shell "su -c 'mkdir -p /data/local/tmp/mesa_cache'"
        adb shell "su -c 'chmod 777 /data/local/tmp/mesa_cache'"
        
        # Set GPU governor to performance (if available)
        adb shell "su -c 'echo performance > /sys/class/kgsl/kgsl-3d0/devfreq/governor'"
        
        # Disable vsync for benchmarking (optional)
        adb shell "su -c 'setprop debug.egl.swapinterval 0'"
        ```
        
        ## 🚨 Troubleshooting
        
        ### Common Issues:
        
        #### 1. **Device Won't Boot / Bootloop**
        ```bash
        # Boot into recovery mode or fastboot
