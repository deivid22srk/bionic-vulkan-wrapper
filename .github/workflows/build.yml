name: Build Mesa Fork

on:
  workflow_dispatch:   # permite rodar manualmente
  push:                # dispara em qualquer branch
    branches: ["**"]
  pull_request:        # dispara em qualquer branch
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Instalar dependências
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          meson ninja-build python3-mako python3-pip \
          libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
          libxcb-glx0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
          libxcb-present-dev libxcb-sync-dev libxshmfence-dev \
          libxxf86vm-dev libxrandr-dev libwayland-dev wayland-protocols \
          libzstd-dev libexpat1-dev libvulkan-dev \
          glslang-tools libglvnd-dev libvdpau-dev \
          libclc-17-dev bison flex llvm-dev clang zlib1g-dev \
          libdrm-dev libdrm-intel-dev libdrm-radeon-dev libdrm-amdgpu-dev libdrm-nouveau-dev

    - name: Configurar build
      run: |
        mkdir build
        cd build
        meson setup ..

    - name: Compilar
      run: |
        cd build
        ninja

    - name: Empacotar em tar.gz
      run: |
        tar -czvf mesa-build.tar.gz -C build .

    - name: Upload artefato
      uses: actions/upload-artifact@v4
      with:
        name: mesa-build-${{ github.ref_name }}
        path: mesa-build.tar.gz
