name: Build Bionic Vulkan Wrapper

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-wrapper:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório atual
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2. Instalar dependências básicas
      - name: Install dependencies
        run: |
          sudo apt update && sudo apt install -y \
            git clang build-essential python3 python3-pip meson ninja-build cmake pkg-config \
            libvulkan-dev vulkan-tools libclc-20-dev glslang-tools libdrm-dev \
            libexpat1-dev libx11-dev libxext-dev libxdamage-dev libxfixes-dev \
            libxcb1-dev libxcb-dri2-0-dev libxcb-dri3-dev libxcb-present-dev \
            libxshmfence-dev libxxf86vm-dev
          # Atualizar pip e instalar mako
          python3 -m pip install --upgrade pip
          python3 -m pip install mako

      # 3. Clonar repositórios necessários
      - name: Clone repositories
        run: |
          git clone https://github.com/leegao/vulkan_wrapper_termux-packages.git
          git clone https://github.com/deivid22srk/bionic-vulkan-wrapper.git

      # 4. Criar diretório build e configurar Meson
      - name: Configure build
        run: |
          cd bionic-vulkan-wrapper
          mkdir -p build && cd build
          meson setup .. \
            --buildtype=${{ github.event.inputs.build_type }} \
            -Dllvm=disabled

      # 5. Compilar com Ninja
      - name: Build wrapper
        run: |
          cd bionic-vulkan-wrapper/build
          ninja

      # 6. Salvar os binários compilados como artefato
      - name: Upload compiled driver
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-driver
          path: bionic-vulkan-wrapper/build/*
