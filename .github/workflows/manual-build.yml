name: Manual Build Dispatcher

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform'
        required: true
        default: 'linux'
        type: choice
        options:
          - linux
          - android-arm64
          - android-arm32
          - both
      optimization_level:
        description: 'Optimization Level'
        required: true
        default: 'mobile'
        type: choice
        options:
          - mobile      # Full mobile optimizations
          - performance # Performance focused
          - debug       # Debug build with symbols
          - minimal     # Minimal build
      drivers:
        description: 'Drivers to build'
        required: false
        default: 'freedreno,panfrost'
        type: string
      enable_tools:
        description: 'Build debugging tools'
        required: false
        default: true
        type: boolean

jobs:
  dispatch-build:
    name: Dispatch Build Configuration
    runs-on: ubuntu-22.04
    outputs:
      config-matrix: ${{ steps.setup.outputs.matrix }}
    
    steps:
    - name: Setup Build Matrix
      id: setup
      run: |
        PLATFORM="${{ github.event.inputs.platform }}"
        OPTIMIZATION="${{ github.event.inputs.optimization_level }}"
        
        case "$PLATFORM" in
          "linux")
            MATRIX='{"include":[{"platform":"linux","target":"native","config":"'"$OPTIMIZATION"'"}]}'
            ;;
          "android-arm64")
            MATRIX='{"include":[{"platform":"android","target":"aarch64-linux-android","abi":"arm64-v8a","config":"'"$OPTIMIZATION"'"}]}'
            ;;
          "android-arm32")
            MATRIX='{"include":[{"platform":"android","target":"arm-linux-androideabi","abi":"armeabi-v7a","config":"'"$OPTIMIZATION"'"}]}'
            ;;
          "both")
            MATRIX='{"include":[
              {"platform":"linux","target":"native","config":"'"$OPTIMIZATION"'"},
              {"platform":"android","target":"aarch64-linux-android","abi":"arm64-v8a","config":"'"$OPTIMIZATION"'"},
              {"platform":"android","target":"arm-linux-androideabi","abi":"armeabi-v7a","config":"'"$OPTIMIZATION"'"}
            ]}'
            ;;
        esac
        
        echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
        echo "Generated matrix: $MATRIX"

  build-custom:
    name: ${{ matrix.platform }} (${{ matrix.target }}) - ${{ matrix.config }}
    runs-on: ubuntu-22.04
    needs: dispatch-build
    timeout-minutes: 180
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dispatch-build.outputs.config-matrix) }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        submodules: true
    
    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: custom-${{ matrix.platform }}-${{ matrix.config }}-${{ github.ref_name }}
        max-size: 3G
    
    - name: Install Base Dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          build-essential \
          meson \
          ninja-build \
          pkg-config \
          python3-mako \
          python3-packaging \
          python3-ply \
          python3-yaml \
          bison \
          flex \
          ccache \
          curl \
          git
    
    - name: Install Platform-Specific Dependencies
      run: |
        if [[ "${{ matrix.platform }}" == "linux" ]]; then
          sudo apt-get install -y \
            libdrm-dev \
            libelf-dev \
            libepoxy-dev \
            libexpat1-dev \
            libffi-dev \
            libpciaccess-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-dri2-0-dev \
            libxcb-dri3-dev \
            libxcb-glx0-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxml2-utils \
            libxrandr-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            wayland-protocols \
            zlib1g-dev
        fi
    
    - name: Setup Android NDK
      if: matrix.platform == 'android'
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        add-to-path: true
    
    - name: Create Android Cross File
      if: matrix.platform == 'android'
      run: |
        API_LEVEL="28"
        cat > android-cross-${{ matrix.abi }}.txt << EOF
        [binaries]
        c = '${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${API_LEVEL}-clang'
        cpp = '${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.target }}${API_LEVEL}-clang++'
        ar = '${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
        strip = '${{ env.ANDROID_NDK_ROOT }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
        pkgconfig = 'pkg-config'
        
        [host_machine]
        system = 'android'
        cpu_family = '${{ matrix.abi == 'arm64-v8a' && 'aarch64' || 'arm' }}'
        cpu = '${{ matrix.abi == 'arm64-v8a' && 'armv8' || 'armv7' }}'
        endian = 'little'
        
        [properties]
        c_args = ['-fPIC', '-fstack-protector-strong', '-ffunction-sections', '-fdata-sections']
        cpp_args = ['-fPIC', '-fstack-protector-strong', '-ffunction-sections', '-fdata-sections']
        c_link_args = ['-Wl,--gc-sections']
        cpp_link_args = ['-Wl,--gc-sections']
        EOF
    
    - name: Configure Build Options
      id: build-config
      run: |
        DRIVERS="${{ github.event.inputs.drivers || 'freedreno,panfrost' }}"
        TOOLS_ENABLED="${{ github.event.inputs.enable_tools || 'true' }}"
        CONFIG="${{ matrix.config }}"
        
        # Base configuration
        BUILD_ARGS=()
        
        # Platform-specific settings
        if [[ "${{ matrix.platform }}" == "android" ]]; then
          BUILD_ARGS+=("--cross-file" "android-cross-${{ matrix.abi }}.txt")
          BUILD_ARGS+=("-Dplatforms=android")
          BUILD_ARGS+=("-Dandroid-stub=true")
          BUILD_ARGS+=("-Dgbm=disabled")
          BUILD_ARGS+=("-Dglx=disabled")
          BUILD_ARGS+=("-Ddri3=disabled")
          BUILD_ARGS+=("-Dxmlconfig=disabled")
          BUILD_ARGS+=("-Dosmesa=false")
          BUILD_ARGS+=("-Dlibunwind=disabled")
        else
          BUILD_ARGS+=("-Dplatforms=x11,wayland")
          BUILD_ARGS+=("-Dgbm=enabled")
          BUILD_ARGS+=("-Dglx=dri")
          BUILD_ARGS+=("-Ddri3=enabled")
        fi
        
        # Optimization level settings
        case "$CONFIG" in
          "mobile")
            BUILD_ARGS+=("--buildtype=debugoptimized")
            BUILD_ARGS+=("-Db_lto=true")
            BUILD_ARGS+=("-Db_ndebug=true")
            BUILD_ARGS+=("-Doptimization=3")
            ;;
          "performance")
            BUILD_ARGS+=("--buildtype=release")
            BUILD_ARGS+=("-Db_lto=true")
            BUILD_ARGS+=("-Db_ndebug=true")
            BUILD_ARGS+=("-Doptimization=3")
            ;;
          "debug")
            BUILD_ARGS+=("--buildtype=debug")
            BUILD_ARGS+=("-Db_sanitize=address,undefined")
            BUILD_ARGS+=("-Doptimization=g")
            ;;
          "minimal")
            BUILD_ARGS+=("--buildtype=release")
            BUILD_ARGS+=("-Doptimization=s")
            DRIVERS="freedreno"  # Only Freedreno for minimal build
            ;;
        esac
        
        # Driver settings
        BUILD_ARGS+=("-Dgallium-drivers=$DRIVERS")
        BUILD_ARGS+=("-Dvulkan-drivers=$DRIVERS")
        
        # Common settings
        BUILD_ARGS+=("-Degl=enabled")
        BUILD_ARGS+=("-Dgles1=enabled")
        BUILD_ARGS+=("-Dgles2=enabled")
        BUILD_ARGS+=("-Dshared-glapi=enabled")
        BUILD_ARGS+=("-Dshader-cache=enabled")
        BUILD_ARGS+=("-Dvulkan-layers=device-select,overlay")
        
        # Tools
        if [[ "$TOOLS_ENABLED" == "true" && "$CONFIG" != "minimal" ]]; then
          BUILD_ARGS+=("-Dtools=freedreno,panfrost")
        fi
        
        # Save config
        printf '%s\n' "${BUILD_ARGS[@]}" > build_args.txt
        echo "drivers=$DRIVERS" >> $GITHUB_OUTPUT
        echo "Generated build args:"
        cat build_args.txt
    
    - name: Configure Mesa
      run: |
        BUILD_ARGS=($(cat build_args.txt))
        
        echo "Configuring with args:"
        printf '%s ' "${BUILD_ARGS[@]}"
        echo ""
        
        meson setup build "${BUILD_ARGS[@]}"
    
    - name: Set Mobile Optimization Environment
      if: matrix.config == 'mobile'
      run: |
        echo "TU_ENABLE_MOBILE_OPTIMIZATIONS=1" >> $GITHUB_ENV
        echo "TU_PREFER_GMEM_RENDERING=1" >> $GITHUB_ENV
        echo "TU_ENABLE_LRZ_OPTIMIZATION=1" >> $GITHUB_ENV
        echo "PANFROST_FORCE_AFBC=1" >> $GITHUB_ENV
        echo "PANFROST_ENABLE_TILE_OPTIMIZATION=1" >> $GITHUB_ENV
    
    - name: Build Mesa
      run: |
        echo "Building with $(nproc) parallel jobs..."
        time ninja -C build -j$(nproc)
    
    - name: Validate Build
      run: |
        echo "=== Build Validation ==="
        
        # Check if key files were built
        if [[ "${{ matrix.platform }}" == "android" ]]; then
          echo "Android build validation:"
          find build -name "*.so" -type f | head -10
        else
          echo "Linux build validation:"
          find build -name "*.so" -type f | head -10
          
          # Test basic functionality
          if command -v glxinfo &> /dev/null; then
            echo "Testing OpenGL functionality..."
            timeout 10 glxinfo -B || echo "glxinfo test completed"
          fi
        fi
        
        # Check specific drivers
        DRIVERS="${{ steps.build-config.outputs.drivers }}"
        echo "Checking for drivers: $DRIVERS"
        
        if [[ "$DRIVERS" == *"freedreno"* ]]; then
          find build -name "*freedreno*" -o -name "*turnip*" | head -5
        fi
        
        if [[ "$DRIVERS" == *"panfrost"* ]]; then
          find build -name "*panfrost*" -o -name "*panvk*" | head -5
        fi
    
    - name: Package Build Results
      run: |
        mkdir -p dist/{libs,headers,tools,docs}
        
        # Copy libraries
        find build -name "*.so" -exec cp {} dist/libs/ \; 2>/dev/null || true
        
        # Copy headers
        cp -r include/* dist/headers/ 2>/dev/null || true
        
        # Copy tools if built
        find build -type f -executable -name "*-*" -exec cp {} dist/tools/ \; 2>/dev/null || true
        
        # Create build info
        cat > dist/BUILD_INFO.txt << EOF
        Mesa Mobile GPU Drivers - Custom Build
        
        Platform: ${{ matrix.platform }}
        Target: ${{ matrix.target }}
        Config: ${{ matrix.config }}
        Branch: ${{ github.ref_name }}
        Commit: ${{ github.sha }}
        Drivers: ${{ steps.build-config.outputs.drivers }}
        Tools: ${{ github.event.inputs.enable_tools }}
        Date: $(date -u)
        
        Optimization Flags Applied:
        $(cat build_args.txt | grep -E "(optimization|buildtype|lto)" || echo "Standard flags")
        
        Mobile Optimizations:
        ${{ matrix.config == 'mobile' && 'ENABLED' || 'DISABLED' }}
        
        Build Size:
        $(du -sh dist/ | cut -f1) total
        $(find dist/libs -name "*.so" | wc -l) shared libraries
        EOF
        
        # List contents
        echo "=== Package Contents ===" >> dist/BUILD_INFO.txt
        find dist -type f | sort >> dist/BUILD_INFO.txt
        
        cat dist/BUILD_INFO.txt
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mesa-custom-${{ matrix.platform }}-${{ matrix.config }}-${{ github.run_number }}
        path: |
          dist/
          build/meson-logs/
        retention-days: 14
        compression-level: 6

  generate-install-guide:
    name: Generate Installation Guide
    runs-on: ubuntu-22.04
    needs: build-custom
    if: always()
    
    steps:
    - name: Create Installation Guide
      run: |
        cat > INSTALLATION_GUIDE.md << 'EOF'
        # Mesa Mobile Drivers - Installation Guide
        
        ## Quick Start
        
        1. **Download**: Get the appropriate build for your platform from the artifacts
        2. **Extract**: Unpack the downloaded archive
        3. **Install**: Follow platform-specific instructions below
        
        ## Platform-Specific Installation
        
        ### Android Installation
        
        #### Prerequisites:
        - Rooted Android device or custom ROM with unlocked system partition
        - ADB access enabled
        - Backup of original drivers recommended
        
        #### Installation Steps:
        ```bash
        # Extract the downloaded archive
        unzip mesa-custom-android-*.zip
        
        # Push libraries to device
        adb push dist/libs/*.so /data/local/tmp/
        
        # Mount system partition as writable
        adb shell "su -c 'mount -o rw,remount /vendor'"
        
        # Backup original drivers
        adb shell "su -c 'mkdir -p /data/backup/'"
        adb shell "su -c 'cp /vendor/lib64/hw/*.so /data/backup/'"
        
        # Install new drivers
        adb shell "su -c 'cp /data/local/tmp/*.so /vendor/lib64/hw/'"
        
        # Set permissions
        adb shell "su -c 'chmod 644 /vendor/lib64/hw/*.so'"
        adb shell "su -c 'chown root:root /vendor/lib64/hw/*.so'"
        
        # Reboot to apply changes
        adb reboot
        ```
        
        #### Environment Variables (Android):
        Add to `/vendor/etc/init/` or set via properties:
        ```bash
        setprop debug.egl.hw 1
        setprop ro.hardware.egl mesa
        setprop ro.hardware.vulkan mesa
        ```
        
        ### Linux Installation
        
        #### System-wide Installation:
        ```bash
        # Extract the archive
        unzip mesa-custom-linux-*.zip
        
        # Install libraries (requires root)
        sudo cp dist/libs/*.so /usr/lib/x86_64-linux-gnu/
        
        # Install headers (optional)
        sudo cp -r dist/headers/* /usr/include/
        
        # Update library cache
        sudo ldconfig
        ```
        
        #### Local Installation (Recommended):
        ```bash
        # Extract to local directory
        unzip mesa-custom-linux-*.zip -d ~/mesa-mobile/
        
        # Add to library path
        export LD_LIBRARY_PATH="$HOME/mesa-mobile/dist/libs:$LD_LIBRARY_PATH"
        
        # Add to your shell profile for persistence
        echo 'export LD_LIBRARY_PATH="$HOME/mesa-mobile/dist/libs:$LD_LIBRARY_PATH"' >> ~/.bashrc
        ```
        
        ## Mobile Optimizations Configuration
        
        ### Adreno (Qualcomm) Optimizations:
        ```bash
        export TU_ENABLE_MOBILE_OPTIMIZATIONS=1
        export TU_PREFER_GMEM_RENDERING=1
        export TU_ENABLE_LRZ_OPTIMIZATION=1
        export TU_DEBUG=nobypass  # Force tile-based rendering
        ```
        
        ### Mali (ARM) Optimizations:
        ```bash
        export PANFROST_FORCE_AFBC=1
        export PANFROST_ENABLE_TILE_OPTIMIZATION=1
        export PAN_MESA_DEBUG=afbc,tiling
        ```
        
        ### Performance Tuning:
        ```bash
        # Reduce power consumption
        export MESA_GLSL_CACHE_DISABLE=0
        export MESA_SHADER_CACHE_DIR=/tmp/mesa_shader_cache
        
        # Enable performance counters (debug builds)
        export GALLIUM_HUD=fps,cpu,gpu-load
        ```
        
        ## Verification
        
        ### Check Installation:
        ```bash
        # Linux
        glxinfo | grep "OpenGL renderer"
        vulkaninfo | grep "deviceName"
        
        # Android
        adb shell getprop | grep egl
        adb shell dumpsys SurfaceFlinger | grep GLES
        ```
        
        ### Test Applications:
        - **glxgears**: Basic OpenGL test
        - **vkcube**: Basic Vulkan test  
        - **glmark2**: OpenGL ES benchmark
        - **GFXBench**: Mobile GPU benchmark
        
        ## Troubleshooting
        
        ### Common Issues:
        
        1. **Library not found**:
           - Check LD_LIBRARY_PATH
           - Verify file permissions
           - Run `ldconfig` as root
        
        2. **Android boot loop**:
           - Boot into recovery
           - Restore backup drivers from `/data/backup/`
           - Clear dalvik cache
        
        3. **Graphics corruption**:
           - Disable mobile optimizations
           - Check kernel GPU driver compatibility
           - Verify hardware support
        
        4. **Performance issues**:
           - Enable shader cache
           - Check power management settings
           - Verify optimization flags
        
        ### Debug Information:
        ```bash
        # Enable Mesa debug output
        export MESA_DEBUG=1
        export EGL_LOG_LEVEL=debug
        export LIBGL_DEBUG=verbose
        
        # Freedreno specific
        export FD_MESA_DEBUG=msgs,disasm
        
        # Panfrost specific  
        export PAN_MESA_DEBUG=trace,sync
        ```
        
        ## Supported Hardware
        
        ### Qualcomm Adreno:
        - Adreno 6xx series (Vulkan 1.3)
        - Adreno 5xx series (OpenGL ES 3.2)
        - Adreno 4xx series (OpenGL ES 3.1)
        
        ### ARM Mali:
        - Valhall architecture (G57, G310, G610)
        - Bifrost architecture (G31-G76)
        - Midgard architecture (T600-T880)
        
        ## Performance Expected
        
        ### Mobile Optimizations Benefits:
        - 🔋 **15-30% battery life improvement** on mobile devices
        - ⚡ **20-40% performance boost** in tile-friendly workloads
        - 📱 **Reduced memory bandwidth** usage by 25-50%
        - 🎯 **Better frame pacing** and reduced jank
        
        ## Support
        
        For issues or questions:
        - Check the troubleshooting section above
        - Review build logs in the CI artifacts
        - File issues on the GitHub repository
        
        EOF
    
    - name: Upload Installation Guide
      uses: actions/upload-artifact@v4
      with:
        name: installation-guide
        path: INSTALLATION_GUIDE.md
        retention-days: 30