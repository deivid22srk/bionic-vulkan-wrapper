        ## 🎯 Quick Reference
        
        ### Installation Commands Summary:
        ```bash
        # 1. Check device
        adb devices && adb shell "su -c 'echo OK'"
        
        # 2. Backup drivers  
        adb shell "su -c 'mkdir -p /data/backup/original-drivers/'"
        adb shell "su -c 'cp /vendor/lib*/hw/*.so /data/backup/original-drivers/'"
        
        # 3. Install Mesa
        adb push drivers/*.so /data/local/tmp/
        adb shell "su -c 'mount -o rw,remount /vendor'"
        adb shell "su -c 'cp /data/local/tmp/*.so /vendor/lib*/hw/'"
        adb shell "su -c 'chmod 644 /vendor/lib*/hw/*.so'"
        
        # 4. Configure & reboot
        adb shell "su -c 'setprop debug.egl.hw 1'"
        adb shell "su -c 'setprop ro.hardware.egl mesa'"
        adb reboot
        ```
        
        ### Recovery Commands:
        ```bash
        # Restore original drivers
        adb shell "su -c 'cp /data/backup/original-drivers/*.so /vendor/lib*/hw/'"
        adb reboot
        ```
        
